name: CI Workflow
on: [ push ]

jobs:
  unit-tests:
    name: Unit tests with sanitizer
    runs-on: [ 'ubuntu-latest' ]
    strategy:
      matrix:
        cmake-build-type:
          - Asan
          - Tsan
          - Ubsan

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run inside container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tests.dockerfile
          outputs: type=cacheonly
          build-args: |
            CMAKE_BUILD_TYPE=${{matrix.cmake-build-type}}

  lint:
    name: Lint with clang-tidy
    if: false # Job disabled until LLVM fixes their packages
    # https://github.com/llvm/llvm-project/issues/153385
    # https://github.com/llvm/llvm-project/issues/180239
    
    runs-on: [ 'ubuntu-latest' ]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run inside container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/clang-tidy.dockerfile
          outputs: type=cacheonly
          build-args: |
            CMAKE_BUILD_TYPE=Debug
